# EduGenesis OS — continuous integration, mapped to GL-01..GL-08.
#
# This file is the DECLARATIVE pipeline of Doc 09 §9.2. Every machine-checkable
# stage maps to a real job below; the four loops that only a person, an incident
# or a governance board can complete are recorded as owner gates, NOT faked as
# green steps. Nothing here claims a run that has not happened.
#
#   §9.2 stage                          Loop                          This workflow
#   ----------------------------------  ----------------------------  ------------------------------------
#   0 Intake                            GL-01 Strategic Planning      gl01_intake (register + doctor)
#   1 Branch + build                    GL-02 Development             gl02_development (typecheck)
#   2 Static analysis                   GL-02 -> GL-05                gl02_static_analysis + static gates in gl08_verify
#   3 Independent review                GL-03 Independent Review      OWNER GATED — independent reviewers, sign-off
#   4 Rework (conditional)              GL-04 Redevelopment           OWNER GATED — finding-to-commit mapping
#   5 Loop testing                      GL-05 Loop Testing            gl05_loop_testing + gl05_accessibility (ARC-I1 fixtures)
#   6 Correction / restoration (cond.)  GL-06 Correction/Restoration  OWNER GATED — incident containment, DR rehearsal
#   7 Resolution / fixing (conditional) GL-07 Resolution/Fixing       OWNER GATED — reporter/ reviewer confirmation
#   8 Package, sign, deploy             GL-08 Repository & Deployment gl08_package_sign + gl08_verify (attestation)
#
# OWNER GATE — THIS PIPELINE CANNOT CURRENTLY RUN.
# GitHub Actions billing is locked on the owner's account, so NO check ever
# reports and there is NO CI run to open. The jobs below declare what WILL run
# once that gate is cleared; they are not a green claim. Because the Render
# service sets autoDeployTrigger: checksPass and no check reports, deployment is
# hand-triggered, not the result of a passing run. P0-3 in docs/exit-criteria.json
# records the same shortfall as owner-blocked (no CI run URL exists to cite).
# Unblock: Repository Owner enables GitHub Actions billing and pushes `main`;
# the run URL is then recorded against P0-3 and GL-01..GL-08 become evidenced.
#
# Every job runs on Node 22 (the supported floor) and uses only the project's
# own scripts. There is no third-party action beyond the GitHub-maintained
# checkout, setup-node and upload-artifact actions.
#
# A green pipeline is the only claim this repository makes — and it is made only
# when a run actually exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gl01_intake:
    name: "GL-01 Strategic Planning — Intake"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      # The machine-checkable part of intake: the register parses, the settings
      # are schema-valid and the tree passes the secrets check. The requirement
      # ID, named owner, KPI and safeguarding flags are owner-supplied.
      - name: Intake health — environment, settings and secrets
        run: npm run doctor

  gl02_development:
    name: "GL-02 Development — Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck every workspace project
        run: npm run typecheck

  # GL-03 Independent Review — OWNER GATED (see header): cross-team reviewers
  # independent of the authoring team, safeguarding sign-off and a signed
  # verdict cannot be produced by a build step.
  # GL-04 Redevelopment — OWNER GATED (conditional): every rework references its
  # review finding ID and adds regression tests; no silent rewrite.

  gl02_static_analysis:
    name: "GL-02 -> GL-05 Static Analysis — Secrets scan"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Scan the published tree and git history for secrets
        run: npm run secrets:scan

  gl05_loop_testing:
    name: "GL-05 Loop Testing — Test suite"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Run the test suite
        run: npm run test:only

  gl05_accessibility:
    name: "GL-05 Loop Testing — Accessibility (an ARC-I1 violation must fail the build)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      # WHY THIS IS ITS OWN JOB: the Phase 0 criterion P0-5 says an
      # accessibility CI job exists that FAILS a build on an ARC-I1 violation,
      # proven by an intentionally broken fixture and a red build. These
      # fixtures build the smallest tree that must fail and assert that the
      # accessibility gate refuses it — so this job is red whenever the gate
      # would let a violating emission through. It is the proof that the
      # pipeline goes red, not a claim that it does.
      - name: The ARC-I1 negative fixtures must go red
        run: node --test packages/verification/dist/gates/negative-fixtures.test.js
      # ...and the gate must be GREEN on the real tree, or the job above is
      # vacuous.
      - name: The accessibility contract gate must pass on the real tree
        run: node tools/verify-all.mjs

  # GL-06 Correction / Restoration and GL-07 Resolution / Fixing — OWNER GATED
  # (conditional): incident containment, a rehearsed restore, and confirmation
  # of closure by the reporter or an independent reviewer are human acts. The
  # rollback procedure itself is documented in README.md -> Deployment.

  gl08_package_sign:
    name: "GL-08 Package/Sign — CycloneDX SBOM"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate the CycloneDX SBOM
        run: npm run sbom
      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  gl08_verify:
    name: "GL-08 Repository & Deployment — Full verification chain"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # The SBOM and the attestation take their timestamp from the commit, not
      # from the clock, so two runs of the same commit produce the same bytes
      # and a digest over them means something.
      - name: Pin the reproducible build time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      # This is the single command the README promises. It must be the command
      # CI runs, or CI would be testing a different claim than the one published.
      - name: Run the full verification chain
        run: npm run verify
      - name: Show the gate table
        if: always()
        run: |
          if [ -f artifacts/verify-report.json ]; then
            node -e "
              const r = require('./artifacts/verify-report.json');
              console.log('result:', r.result);
              console.log('gates:', r.counts.gates, 'passed:', r.counts.passed,
                          'blockers failed:', r.counts.blockersFailed,
                          'warnings:', r.counts.warnings);
              for (const g of r.gates) console.log(' ', g.result.padEnd(5), g.id);
            "
          else
            echo "no verify-report.json was produced — the chain failed before the gates ran"
          fi
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            artifacts/verify-report.json
            artifacts/sbom.cdx.json
            artifacts/checksums.sha256
            artifacts/attestation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Environment doctor
        run: npm run doctor
