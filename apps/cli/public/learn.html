<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduGenesis OS — ask a question</title>
    <!--
      The Aurora design tokens. Every colour, every focus ring and every
      component style comes from here, so the learner screen cannot drift away
      from the design system.
    -->
    <link rel="stylesheet" href="/assets/edugenesis-tokens.css" />
    <link rel="stylesheet" href="/app.css" />
    <!-- The browser asks for this by itself; naming it here keeps the console clean. -->
    <link rel="icon" href="/icon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#ask-form">Skip to the question</a>

    <main class="eg-main" id="main">
      <header class="eg-header">
        <h1>Ask a question</h1>
        <p class="lede">
          Type anything you want to learn. Every answer is checked for accessibility before it
          reaches you.
        </p>
      </header>

      <form id="ask-form" novalidate>
        <div class="field">
          <label class="label" for="question">Your question</label>
          <input
            id="question"
            name="question"
            type="text"
            autocomplete="off"
            aria-describedby="hint-question"
            placeholder="Explain curriculum:algebra/linear-eq"
          />
          <p class="hint" id="hint-question">
            A specific question gets a specific lesson. For example: “Explain curriculum:algebra/linear-eq”.
          </p>
        </div>

        <div class="eg-actions">
          <button class="btn btn--primary" id="ask-button" type="submit">Ask</button>
        </div>

        <section class="eg-section" id="answer-section" aria-labelledby="answer-heading">
          <h2 id="answer-heading">Your lesson</h2>
          <!--
            The live region. The answer is announced here: `role="status"` with
            `aria-live="polite"` means a screen reader speaks the result when it
            arrives, without the learner hunting for it.
          -->
          <p id="status" class="eg-status" role="status" aria-live="polite"></p>
          <div class="card" id="answer" hidden>
            <p id="answer-text"></p>
          </div>
        </section>
      </form>

      <footer class="eg-footer">
        <p><a href="/">Settings</a></p>
      </footer>
    </main>

    <script>
      (function () {
        'use strict';

        var form = document.getElementById('ask-form');
        var input = document.getElementById('question');
        var button = document.getElementById('ask-button');
        var status = document.getElementById('status');
        var answer = document.getElementById('answer');
        var answerText = document.getElementById('answer-text');

        function say(message, tone) {
          status.textContent = message;
          if (tone) {
            status.setAttribute('data-tone', tone);
          } else {
            status.removeAttribute('data-tone');
          }
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var question = input.value.trim();
          if (question.length === 0) {
            say('Type a question first.', 'error');
            input.focus();
            return;
          }
          button.disabled = true;
          say('Preparing your lesson…');

          fetch('/api/learn', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: question }),
          })
            .then(function (response) {
              return response.json().then(function (payload) {
                return { ok: response.ok, payload: payload };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                say(
                  result.payload && result.payload.error
                    ? result.payload.error
                    : 'A lesson is not available right now.',
                  'error',
                );
                answer.hidden = true;
                answerText.textContent = '';
                return;
              }
              answerText.textContent = result.payload.text;
              answer.hidden = false;
              say('Your lesson is ready.', 'ok');
            })
            .catch(function () {
              say('A lesson is not available right now. Please try again shortly.', 'error');
            })
            .then(function () {
              button.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
